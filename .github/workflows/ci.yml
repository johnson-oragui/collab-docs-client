name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
      - dev

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Lint, Format, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      # Get the repository source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js 24 and enable npm dependency caching.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Install exact dependency versions from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Check the entire project for ESLint errors.
      - name: Run ESLint
        run: npm run lint

      # Verify formatting without modifying any files.
      - name: Check Prettier formatting
        run: npm run format:check

      # Check TypeScript types.
      - name: Run TypeScript checks
        run: npm run typecheck

      # Execute all Vitest test suites.
      - name: Run tests
        run: npm test
